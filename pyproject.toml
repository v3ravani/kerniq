[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kerniq"
version = "1.0.0"
description = "Don't babysit your terminal. Monitor every task, wherever you are."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Viraj Ravani", email = "viraj.ravani@somaiya.edu" }
]
keywords = [
    "terminal",
    "process-monitoring",
    "task-monitoring",
    "cli",
    "telegram",
    "developer-tools",
    "process-management",
    "resource-monitoring",
    "command-line",
    "local-first",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities"
]
dependencies = [
    "psutil>=5.9.0",
    "requests>=2.28.0",
    "keyring>=24.0.0",
    "cryptography>=3.4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "build>=1.0.0"
]

[project.scripts]
kerniq = "kerniq.cli:main"

[project.urls]
Homepage = "https://github.com/v3ravani/kerniq"
Documentation = "https://github.com/v3ravani/kerniq#readme"
Issues = "https://github.com/v3ravani/kerniq/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["kerniq*"]
